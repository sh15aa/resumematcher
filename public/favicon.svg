<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>

  <!-- Resume Sheet Base -->
  <g filter="url(#shadow)">
    <!-- Document Card -->
    <rect x="14" y="10" width="36" height="44" rx="4" fill="#ffffff"/>
    
    <!-- Top Fold / Accent Line -->
    <path d="M14 14 C14 12 16 10 18 10 L46 10 C48 10 50 12 50 14 L50 17 L14 17 Z" fill="#e2e8f0"/>
    
    <!-- Header Block / Candidate Name -->
    <rect x="19" y="21" width="18" height="3.5" rx="1.5" fill="#1e293b"/>
    
    <!-- Section Divider Line -->
    <rect x="19" y="27" width="26" height="1.5" rx="0.75" fill="#3b82f6"/>
    
    <!-- Resume Content Lines -->
    <rect x="19" y="31.5" width="26" height="2" rx="1" fill="#94a3b8"/>
    <rect x="19" y="35.5" width="21" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="19" y="39.5" width="24" height="2" rx="1" fill="#cbd5e1"/>
    
    <!-- Bottom Badge Checkmark / Target (100% Match) -->
    <circle cx="42" cy="42" r="9" fill="url(#accentGrad)"/>
    <path d="M38 42 L41 45 L47 39" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Right AI Match Sparkle -->
  <path d="M47 5 C47 9 49 11 53 11 C49 11 47 13 47 17 C47 13 45 11 41 11 C45 11 47 9 47 5 Z" fill="url(#sparkleGrad)"/>
</svg>
